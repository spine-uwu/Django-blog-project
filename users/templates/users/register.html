{% extends "blog/base.html" %}
{%load crispy_forms_tags%}
{%block content%}
    <div class = 'content-section'> 
            <form method='POST'>
                {% csrf_token %}
                <fieldset>
                    <legend class='border-bottom mb-4'>
                        Join Today!
                    </legend>
                    {{form|crispy}}
                </fieldset>
                <div>
                    <button class='btn btn-outline-info' type='submit'>
                        Sign Up
                    </button>
                </div>
            </form>
            <div class='border-top pt-3'>
                <small class='text-muted'>
                    Already have an account? <a class='ms-2' href='{% url "register" %}'> Sign In </a>
                </small>
            </div>
    </div>
{%endblock content%}
