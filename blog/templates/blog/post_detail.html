{% extends "blog/base.html" %}
{%block content%}  
    <h1>{{ object.title }}</h1>
    <img class="rounded-circle article-img" src="{{ object.author.profile.image.url }}">
    <p> By <a class = 'mr-2' href = '{ % url "user-posts" post.author.username % }'> {{object.author }} </a> on {{object.date_posted}}</p>
    <p> {{object.content }} </p>
{%endblock content%}
